# set true colour
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato, mocha

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'dreamsofcode-io/catppuccin-tmux' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'tmu-plugins/tmux-yank'

# Tmux resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Tmux continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
